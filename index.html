<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie des kiosques</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-main: #F8FAF9;
    --bg-sidebar: #FFFFFF;
    --border-color: #E2E8E5;
    --border-light: #EEF2F0;
    --text-primary: #142820;
    --text-secondary: #4A5B53;
    --text-muted: #7A8D84;
    --primary-green: #2E7D5B;
    --accent-orange: #E68A00;
    --accent-red: #D82727;
    --shadow-sm: 0 2px 8px rgba(20,40,32,0.06);
    --shadow-md: 0 8px 24px rgba(20,40,32,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Montserrat', sans-serif;
    background:var(--bg-main);
    color:var(--text-primary);
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns: 390px 1fr;
    height:100vh;
    width:100vw;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--bg-sidebar);
    color:var(--text-primary);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    border-right:1px solid var(--border-color);
    box-shadow: 2px 0 16px rgba(0,0,0,0.03);
  }
  .sidebar-header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border-light);
    flex-shrink:0;
    background:#FFFFFF;
  }
  .brand-eyebrow{
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--primary-green);
    margin:0 0 6px;
    font-weight: 700;
  }
  .brand-title{
    font-size:22px;
    font-weight:800;
    line-height:1.2;
    margin:0 0 12px;
    color:var(--text-primary);
  }
  .brand-stats{
    display:flex;
    gap:10px;
  }
  .stat-chip{
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-radius:10px;
    padding:8px 10px;
    flex:1;
  }
  .stat-chip .n{
    font-size:18px;
    font-weight:800;
    color:var(--primary-green);
    display:block;
    line-height:1.1;
  }
  .stat-chip .l{
    font-size:9.5px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight: 600;
  }

  .sidebar-scroll{
    flex:1;
    overflow-y:auto;
    padding:16px 20px 24px;
  }
  .sidebar-scroll::-webkit-scrollbar{width:6px;}
  .sidebar-scroll::-webkit-scrollbar-thumb{background:#D1DCD6;border-radius:4px;}

  .search-box{
    position:relative;
    margin-bottom:14px;
  }
  .search-box input{
    width:100%;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-radius:9px;
    color:var(--text-primary);
    padding:10px 12px 10px 36px;
    font-size:12.5px;
    font-family:'Montserrat',sans-serif;
    font-weight: 500;
    outline:none;
    transition:all .15s;
  }
  .search-box input:focus{
    border-color:var(--primary-green);
    background:#FFFFFF;
    box-shadow: 0 0 0 3px rgba(46,125,91,0.12);
  }
  .search-box input::placeholder{color:var(--text-muted);}
  .search-box svg{
    position:absolute;
    left:12px; top:50%; transform:translateY(-50%);
    width:15px;height:15px;
    stroke:var(--text-muted);
  }

  .filter-row{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap:6px;
    margin-bottom:14px;
  }
  select.mini-select{
    width:100%;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    color:var(--text-primary);
    border-radius:8px;
    padding:7px 5px;
    font-size:11px;
    font-family:'Montserrat',sans-serif;
    font-weight: 600;
    outline:none;
  }
  select.mini-select:focus{
    border-color:var(--primary-green);
    background:#FFFFFF;
  }

  .section-label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:22px 0 8px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 700;
  }
  .section-label:first-child{margin-top:0;}
  .section-label .num{
    color:var(--primary-green);
    font-weight:800;
  }

  .layer-group{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .layer-option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .12s;
    font-size:12px;
    font-weight: 500;
    color:var(--text-secondary);
    background:#FFFFFF;
  }
  .layer-option:hover{
    background:var(--bg-main);
    color:var(--text-primary);
  }
  .layer-option.active{
    background:#EAF4EE;
    border-color:#BCE0CE;
    color:var(--primary-green);
    font-weight:700;
  }
  .layer-option .swatch{
    width:10px;height:10px;border-radius:50%;
    flex-shrink:0;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.06);
  }
  .layer-option .txt{flex:1;}
  .layer-option .count{
    font-size:10.5px;
    color:var(--text-muted);
    background:var(--bg-main);
    padding:2px 7px;
    border-radius:5px;
    font-weight: 600;
  }
  .layer-option.active .count{
    color:var(--primary-green);
    background:#D6ECDF;
  }

  .legend-box{
    margin-top:14px;
    padding:12px;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-radius:10px;
  }
  .legend-title{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    margin-bottom:8px;
    font-weight: 700;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11.5px;
    color:var(--text-secondary);
    padding:3px 0;
    font-weight: 600;
  }
  .legend-item .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .kiosk-list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .kiosk-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 10px;
    border-radius:7px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .12s;
  }
  .kiosk-row:hover{
    background:var(--bg-main);
    border-color:var(--border-color);
  }
  .kiosk-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .kiosk-row .name{font-size:12px;color:var(--text-primary);font-weight:600;}
  .kiosk-row .sub{font-size:10.5px;color:var(--text-muted);margin-left:auto;font-weight:600;}

  .empty-note{
    font-size:12px;
    color:var(--text-muted);
    padding:8px 2px;
    font-style:italic;
  }

  /* ---------- MAP & OVERLAYS ---------- */
  .map-wrap{position:relative;height:100vh;}
  #map{height:100%;width:100%;background:#EAE6DF;}

  .top-bar{
    position:absolute;
    top:16px; left:16px; right:16px;
    z-index:500;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
  }
  .layer-title-card{
    background:rgba(255, 255, 255, 0.94);
    backdrop-filter:blur(8px);
    color:var(--text-primary);
    padding:12px 18px;
    border-radius:12px;
    pointer-events:auto;
    max-width:420px;
    border:1px solid var(--border-color);
    box-shadow:var(--shadow-md);
  }
  .layer-title-card .eyebrow{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--primary-green);
    margin-bottom:3px;
    font-weight: 700;
  }
  .layer-title-card .ttl{
    font-size:15px;
    font-weight:800;
  }
  .geo-status{
    background:rgba(255, 255, 255, 0.94);
    backdrop-filter:blur(8px);
    color:var(--text-primary);
    padding:10px 14px;
    border-radius:10px;
    pointer-events:auto;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid var(--border-color);
    box-shadow:var(--shadow-md);
    transition: opacity 0.5s ease;
    font-weight: 600;
  }
  .geo-status .spinner{
    width:13px;height:13px;
    border:2px solid rgba(46,125,91,0.25);
    border-top-color:var(--primary-green);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-status.done .spinner{display:none;}
  .geo-status .
