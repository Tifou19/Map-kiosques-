<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie des kiosques</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-main: #F8FAF9;
    --bg-sidebar: #FFFFFF;
    --card-bg: #FFFFFF;
    --border-color: #E2E8E5;
    --border-light: #EEF2F0;
    --text-primary: #142820;
    --text-secondary: #5A6B63;
    --text-muted: #879990;
    --primary-green: #2E7D5B;
    --accent-orange: #E68A00;
    --accent-red: #D82727;
    --accent-blue: #2A6F97;
    --shadow-sm: 0 2px 8px rgba(20,40,32,0.06);
    --shadow-md: 0 8px 24px rgba(20,40,32,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Montserrat', sans-serif;
    background:var(--bg-main);
    color:var(--text-primary);
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns: 390px 1fr;
    height:100vh;
    width:100vw;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--bg-sidebar);
    color:var(--text-primary);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    border-right:1px solid var(--border-color);
    box-shadow: 2px 0 16px rgba(0,0,0,0.03);
  }
  .sidebar-header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--border-light);
    flex-shrink:0;
    background:#FFFFFF;
  }
  .brand-eyebrow{
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--primary-green);
    margin:0 0 6px;
    font-weight: 700;
  }
  .brand-title{
    font-size:22px;
    font-weight:800;
    line-height:1.2;
    margin:0 0 12px;
    color:var(--text-primary);
  }
  .brand-stats{
    display:flex;
    gap:10px;
  }
  .stat-chip{
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-radius:10px;
    padding:8px 10px;
    flex:1;
  }
  .stat-chip .n{
    font-size:18px;
    font-weight:800;
    color:var(--primary-green);
    display:block;
    line-height:1.1;
  }
  .stat-chip .l{
    font-size:9.5px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight: 600;
  }

  .sidebar-scroll{
    flex:1;
    overflow-y:auto;
    padding:16px 20px 24px;
  }
  .sidebar-scroll::-webkit-scrollbar{width:6px;}
  .sidebar-scroll::-webkit-scrollbar-thumb{background:#D1DCD6;border-radius:4px;}

  .search-box{
    position:relative;
    margin-bottom:14px;
  }
  .search-box input{
    width:100%;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-radius:9px;
    color:var(--text-primary);
    padding:10px 12px 10px 36px;
    font-size:12.5px;
    font-family:'Montserrat',sans-serif;
    font-weight: 500;
    outline:none;
    transition:all .15s;
  }
  .search-box input:focus{
    border-color:var(--primary-green);
    background:#FFFFFF;
    box-shadow: 0 0 0 3px rgba(46,125,91,0.12);
  }
  .search-box input::placeholder{color:var(--text-muted);}
  .search-box svg{
    position:absolute;
    left:12px; top:50%; transform:translateY(-50%);
    width:15px;height:15px;
    stroke:var(--text-muted);
  }

  .filter-row{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  select.mini-select{
    flex:1;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    color:var(--text-primary);
    border-radius:8px;
    padding:7px 6px;
    font-size:11.5px;
    font-family:'Montserrat',sans-serif;
    font-weight: 600;
    outline:none;
  }
  select.mini-select:focus{
    border-color:var(--primary-green);
    background:#FFFFFF;
  }

  .section-label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:22px 0 8px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight: 700;
  }
  .section-label:first-child{margin-top:0;}
  .section-label .num{
    color:var(--primary-green);
    font-weight:800;
  }

  .layer-group{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .layer-option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .12s;
    font-size:12px;
    font-weight: 500;
    color:var(--text-secondary);
    background:#FFFFFF;
  }
  .layer-option:hover{
    background:var(--bg-main);
    color:var(--text-primary);
  }
  .layer-option.active{
    background:#EAF4EE;
    border-color:#BCE0CE;
    color:var(--primary-green);
    font-weight:700;
  }
  .layer-option .swatch{
    width:10px;height:10px;border-radius:50%;
    flex-shrink:0;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.06);
  }
  .layer-option .txt{flex:1;}
  .layer-option .count{
    font-size:10.5px;
    color:var(--text-muted);
    background:var(--bg-main);
    padding:2px 7px;
    border-radius:5px;
    font-weight: 600;
  }
  .layer-option.active .count{
    color:var(--primary-green);
    background:#D6ECDF;
  }

  .legend-box{
    margin-top:14px;
    padding:12px;
    background:var(--bg-main);
    border:1px solid var(--border-color);
    border-radius:10px;
  }
  .legend-title{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    margin-bottom:8px;
    font-weight: 700;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11.5px;
    color:var(--text-secondary);
    padding:3px 0;
    font-weight: 600;
  }
  .legend-item .sw{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .kiosk-list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .kiosk-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 10px;
    border-radius:7px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .12s;
  }
  .kiosk-row:hover{
    background:var(--bg-main);
    border-color:var(--border-color);
  }
  .kiosk-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .kiosk-row .name{font-size:12px;color:var(--text-primary);font-weight:600;}
  .kiosk-row .sub{font-size:10.5px;color:var(--text-muted);margin-left:auto;font-weight:600;}

  .empty-note{
    font-size:12px;
    color:var(--text-muted);
    padding:8px 2px;
    font-style:italic;
  }

  /* ---------- MAP & OVERLAYS ---------- */
  .map-wrap{position:relative;height:100vh;}
  #map{height:100%;width:100%;background:#EAE6DF;}

  .top-bar{
    position:absolute;
    top:16px; left:16px; right:16px;
    z-index:500;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
  }
  .layer-title-card{
    background:rgba(255, 255, 255, 0.94);
    backdrop-filter:blur(8px);
    color:var(--text-primary);
    padding:12px 18px;
    border-radius:12px;
    pointer-events:auto;
    max-width:420px;
    border:1px solid var(--border-color);
    box-shadow:var(--shadow-md);
  }
  .layer-title-card .eyebrow{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--primary-green);
    margin-bottom:3px;
    font-weight: 700;
  }
  .layer-title-card .ttl{
    font-size:15px;
    font-weight:800;
  }
  .geo-status{
    background:rgba(255, 255, 255, 0.94);
    backdrop-filter:blur(8px);
    color:var(--text-primary);
    padding:10px 14px;
    border-radius:10px;
    pointer-events:auto;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid var(--border-color);
    box-shadow:var(--shadow-md);
    transition: opacity 0.5s ease;
    font-weight: 600;
  }
  .geo-status .spinner{
    width:13px;height:13px;
    border:2px solid rgba(46,125,91,0.25);
    border-top-color:var(--primary-green);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-status.done .spinner{display:none;}
  .geo-status .bar-track{
    width:70px;height:4px;background:#E2E8E5;border-radius:3px;overflow:hidden;
  }
  .geo-status .bar-fill{
    height:100%;background:var(--primary-green);width:0%;transition:width .3s;
  }

  /* LOGO MARKERS PIN */
  .logo-marker-pin{
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 2.5px solid var(--primary-green);
    box-shadow: 0 4px 12px rgba(20,40,32,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    overflow: hidden;
    padding: 4px;
  }
  .logo-marker-pin:hover, .logo-marker-pin.hl{
    transform: scale(1.25);
    box-shadow: 0 8px 20px rgba(20,40,32,0.28);
    z-index: 9999 !important;
  }
  .logo-marker-pin svg{
    width: 100%;
    height: 100%;
  }

  /* POPUP STYLING & TEINTES PASTEL */
  .leaflet-popup-content-wrapper{
    border-radius:14px;
    box-shadow:var(--shadow-md);
    font-family:'Montserrat', sans-serif;
    padding: 2px;
  }
  .popup-card{
    font-family:'Montserrat',sans-serif;
    min-width:250px;
    max-width:290px;
    padding: 12px;
    border-radius: 12px;
  }

  /* Fonds doux selon la marque */
  .popup-card.bg-vertufood{
    background: linear-gradient(180deg, #FFF9EB 0%, #FFFFFF 100%);
    border: 1px solid #F5E1B5;
  }
  .popup-card.bg-fraicherie{
    background: linear-gradient(180deg, #EEF7F2 0%, #FFFFFF 100%);
    border: 1px solid #CFE6D9;
  }
  .popup-card.bg-kumo{
    background: linear-gradient(180deg, #FDF2F2 0%, #FFFFFF 100%);
    border: 1px solid #FAD1D1;
  }

  .popup-card .ph-name{
    font-weight:800;
    font-size:15.5px;
    color:var(--text-primary);
    margin-bottom:3px;
  }
  .popup-card .ph-sub{
    font-size:11px;
    color:var(--text-secondary);
    margin-bottom:10px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .tag{
    display:inline-block;
    font-size:9.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background:rgba(255,255,255,0.85);
    border:1px solid var(--border-color);
    color:var(--text-primary);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .tag.brand{background:#EAF4EE; border-color:#C3E5D4; color:var(--primary-green);}
  .popup-card .ph-row{
    display:flex;
    gap:8px;
    font-size:11.5px;
    padding:5px 0;
    border-top:1px solid rgba(0,0,0,0.06);
    font-weight: 500;
  }
  .popup-card .ph-row:first-of-type{border-top:1px solid rgba(0,0,0,0.06); margin-top:6px;}
  .popup-card .ph-row .k{
    color:var(--text-muted);
    min-width:88px;
    flex-shrink:0;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight: 700;
    padding-top:1px;
  }
  .popup-card .ph-row .v{color:var(--text-primary); line-height:1.4;}
  .popup-card .ph-row .v a{color:var(--primary-green); text-decoration:none; font-weight:700;}
  .popup-card .ph-row .v a:hover{text-decoration:underline;}
  .supply-pills{display:flex; gap:5px; flex-wrap:wrap;}
  .pill{
    font-size:9.5px;
    padding:2px 6px;
    border-radius:5px;
    background:rgba(255,255,255,0.7);
    border:1px solid var(--border-color);
    font-weight: 600;
  }
  .pill.on{background:#E4F0E7; border-color:#B8D8C0; color:var(--primary-green); font-weight:700;}
  .pill.off{color:var(--text-muted);}

  .leaflet-control-zoom a{
    background:#FFFFFF!important;
    color:var(--text-primary)!important;
    border-color:var(--border-color)!important;
    font-family:'Montserrat', sans-serif!important;
    box-shadow:var(--shadow-sm);
  }

  /* Cluster */
  .marker-cluster-custom{
    background:#FFFFFF;
    border:2.5px solid var(--primary-green);
    border-radius:50%;
    color:var(--primary-green);
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    box-shadow: 0 4px 14px rgba(20,40,32,0.18);
    transition: all 0.3s ease;
  }
  .marker-cluster-custom .cluster-inner-text{
    transition: filter 0.3s ease, opacity 0.3s ease;
  }
  body.zoom-out-blurred .marker-cluster-custom .cluster-inner-text{
    filter: blur(4.5px);
    opacity: 0.5;
    user-select: none;
  }

  @media (max-width: 860px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:fixed; z-index:900; width:86vw; max-width:360px; transform:translateX(-100%); transition:transform .2s;}
    .sidebar.open{transform:translateX(0);}
    .map-toggle{
      position:absolute; top:16px; left:16px; z-index:600;
      background:#FFFFFF; color:var(--text-primary);
      border:1px solid var(--border-color); border-radius:9px; padding:10px 12px;
      display:flex; align-items:center; gap:6px; font-size:12px;
      box-shadow:var(--shadow-md);
      font-family:'Montserrat', sans-serif;
      font-weight:700;
    }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <p class="brand-eyebrow">Réseau de kiosques &mdash; Vue terrain</p>
      <h1 class="brand-title">Cartographie des<br>kiosques</h1>
      <div class="brand-stats">
        <div class="stat-chip"><span class="n" id="statTotal">0</span><span class="l">Kiosques</span></div>
        <div class="stat-chip"><span class="n" id="statVisible">0</span><span class="l">Sur cette vue</span></div>
        <div class="stat-chip"><span class="n" id="statRegions">0</span><span class="l">Régions</span></div>
      </div>
    </div>

    <div class="sidebar-scroll">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Rechercher un kiosque, une ville, une enseigne…" autocomplete="off">
      </div>

      <div class="filter-row">
        <select class="mini-select" id="filterRegion"><option value="">Toutes régions</option></select>
        <select class="mini-select" id="filterEnseigne"><option value="">Toutes enseignes</option></select>
        <select class="mini-select" id="filterDr"><option value="">Tous les DR</option></select>
      </div>

      <div class="section-label"><span class="num">01</span> Livraison &amp; production</div>
      <div class="layer-group" id="grpLivraison"></div>

      <div class="section-label"><span class="num">02</span> Fournisseurs FLEG</div>
      <div class="layer-group" id="grpFournisseurs"></div>

      <div class="section-label"><span class="num">03</span> Directeurs régionaux (DR)</div>
      <div class="layer-group" id="grpDrs"></div>

      <div class="section-label"><span class="num">04</span> Concepts</div>
      <div class="layer-group" id="grpConcepts"></div>

      <div class="legend-box" id="legendBox" style="display:none;">
        <div class="legend-title">Légende</div>
        <div id="legendItems"></div>
      </div>

      <div class="section-label"><span class="num">05</span> Kiosques (<span id="kioskListCount">0</span>)</div>
      <div class="kiosk-list" id="kioskList"></div>
    </div>
  </aside>

  <div class="map-wrap">
    <button class="map-toggle" id="mapToggle" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      Filtres
    </button>
    <div class="top-bar">
      <div class="layer-title-card">
        <div class="eyebrow">Vue active</div>
        <div class="ttl" id="activeLayerTitle">Tous les kiosques</div>
      </div>
      <div class="geo-status" id="geoStatus">
        <div class="spinner"></div>
        <span id="geoStatusText">Localisation des kiosques…</span>
        <div class="bar-track"><div class="bar-fill" id="geoBarFill"></div></div>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>

function makeLogoPinIcon(k, borderColor, hl){

function jitter(lat, lon, seed){
  const a = (seed*9301+49297)%233280/233280;
  const b = ((seed*3+7)*9301+49297)%233280/233280;
  return [lat + (a-0.5)*0.012, lon + (b-0.5)*0.012];
}

function getBrandThemeClass(k){
  const c = (k.concepts || '').toUpperCase();
  const s = (k.societe || '').toUpperCase();
  if(c === 'KUMO' || s === 'KUMO') return 'bg-kumo';
  if(s.includes('FRAICHERIE') || c.includes('FRAICHERIE')) return 'bg-fraicherie';

function popupHTML(k){
  const pill = (label, val, active) => '<span class="pill '+(active?'on':'off')+'">'+label+(val?(': '+val):'')+'</span>';
  const supplyRow = () => {
    return '<div class="supply-pills">'
      + pill('FLEG', k.fleg, k.fleg && k.fleg!=='NON')
      + pill('Snacking', k.snacking, k.snacking && k.snacking!=='NON')
      + pill('FSOL', k.fsol, k.fsol && k.fsol!=='NON')
      + '</div>';
  };
  const row = (label, val, isLink) => {
    if(!val) return '';
    const v = isLink ? '<a href="mailto:'+val+'">'+val+'</a>' : val;
    return '<div class="ph-row"><div class="k">'+label+'</div><div class="v">'+v+'</div></div>';
  };
  const themeClass = getBrandThemeClass(k);

  return '<div class="popup-card ' + themeClass + '">'
    + '<div class="ph-name">'+k.kiosque+'</div>'
    + '<div class="ph-sub"><span class="tag brand">'+k.societe+'</span><span class="tag">'+k.enseigne+'</span>'+(k.concepts?'<span class="tag">'+k.concepts+'</span>':'')+'</div>'
    + row('Adresse', (k.adresse||'')+(k.cp?(' — '+k.cp):''))
    + row('Région / DR', k.region+(k.dr?(' · '+k.dr):''))
    + row('Tél. DR', k.telDr)
    + row('Gestionnaire', k.gestionnaire+(k.telPdv?(' · '+k.telPdv):''))
    + '<div class="ph-row"><div class="k">Livraison</div><div class="v">'+supplyRow()+'</div></div>'
    + row('Créneaux', k.creneaux)
    + row('Fourn. FLEG', k.fournisseurFleg)
    + row('Fourn. Frais/Épic.', k.fournisseurFrais)
    + row('Mail kiosque', k.mailKiosque, true)
    + row('Mail facturation', k.mailFacturation, true)
    + row('SIRET', k.siret)
    + '</div>';
}

function buildMarkers(){
  geoBarFill.style.width = '100%';
  geoStatus.classList.add('done');
  geoStatusText.textContent = 'Localisation terminée';
  setTimeout(()=>{ geoStatus.style.opacity='0'; geoStatus.style.pointerEvents='none'; }, 800);

  const cpSeed = {};
  KIOSQUES.forEach((k, idx)=>{
    let base = KNOWN_COORDS[k.cp];
    if(!base){
      const rc = REGION_CENTROIDS[k.region] || [46.6, 2.4];
      base = rc;
    }
    cpSeed[k.cp] = (cpSeed[k.cp]||0) + 1;
    const [lat, lon] = jitter(base[0], base[1], idx + cpSeed[k.cp]*13);
    const marker = L.marker([lat, lon], { icon: makeLogoPinIcon(k, GREY, false) });
    marker.bindPopup(popupHTML(k), { maxWidth:320 });
    marker.kioskData = k;
    marker.latlngRaw = [lat, lon];
    markers.push({ kiosk:k, marker });
  });

  populateFilters();
  applyLayer('all');
}

/* ============ LAYER APPLICATION ============ */
function applyLayer(layerId){
  activeLayerId = layerId;
  const layer = LAYERS.find(l=>l.id===layerId);
  document.getElementById('activeLayerTitle').textContent = layer.label;

  document.querySelectorAll('.layer-option').forEach(el=>{
    el.classList.toggle('active', el.dataset.layerId===layerId);
  });

  const regionSel = document.getElementById('filterRegion').value;
  const enseigneSel = document.getElementById('filterEnseigne').value;
  const drSel = document.getElementById('filterDr').value;
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

  clusterGroup.clearLayers();
  let visibleCount = 0;

  markers.forEach(({kiosk, marker})=>{
    let matchesFilters = true;
    if(regionSel && kiosk.region !== regionSel) matchesFilters = false;
    if(enseigneSel && kiosk.enseigne !== enseigneSel) matchesFilters = false;
    if(drSel && kiosk.dr !== drSel) matchesFilters = false;
    if(searchTerm){
      const hay = (kiosk.kiosque+' '+kiosk.enseigne+' '+kiosk.dr+' '+kiosk.region+' '+kiosk.cp+' '+(kiosk.adresse||'')).toLowerCase();
      if(!hay.includes(searchTerm)) matchesFilters = false;
    }

    let isLayerMatch = true;
    let borderColor = GREY;

    if(layer.mode === 'color'){
      const key = kiosk[layer.colorKey] || 'Non renseigné';
      borderColor = colorFor(key, colorMaps[layer.colorKey]);
    } else {
      isLayerMatch = layer.test(kiosk);
      borderColor = isLayerMatch ? layer.color : GREY;
    }

    const shouldShow = matchesFilters && isLayerMatch;

    if(shouldShow){
      marker.setIcon(makeLogoPinIcon(kiosk, borderColor, false));
      clusterGroup.addLayer(marker);
      visibleCount++;
    }
  });

  document.getElementById('statVisible').textContent = visibleCount;
  updateLegend(layer);
  buildKioskList();
}

function updateLegend(layer){
  const box = document.getElementById('legendBox');
  const items = document.getElementById('legendItems');
  if(layer.mode !== 'color'){ box.style.display='none'; return; }
  const entries = layer.legend();
  items.innerHTML = entries.map(([k,c])=>'<div class="legend-item"><span class="sw" style="background:'+c+';"></span>'+k+'</div>').join('');
  box.style.display = 'block';
}

}

function populateFilters(){
  const regions = [...new Set(KIOSQUES.map(k=>k.region).filter(Boolean))].sort();
  const enseignes = [...new Set(KIOSQUES.map(k=>k.enseigne).filter(Boolean))].sort();
  const drs = [...new Set(KIOSQUES.map(k=>k.dr).filter(Boolean))].sort();

  const rSel = document.getElementById('filterRegion');
  const eSel = document.getElementById('filterEnseigne');
  const dSel = document.getElementById('filterDr');

  regions.forEach(r=> rSel.insertAdjacentHTML('beforeend', '<option value="'+r+'">'+r+'</option>'));
  enseignes.forEach(en=> eSel.insertAdjacentHTML('beforeend', '<option value="'+en+'">'+en+'</option>'));
  drs.forEach(d=> dSel.insertAdjacentHTML('beforeend', '<option value="'+d+'">'+d+'</option>'));

  document.getElementById('statRegions').textContent = regions.length;
  document.getElementById('statTotal').textContent = KIOSQUES.length;

  rSel.addEventListener('change', ()=>applyLayer(activeLayerId));
  eSel.addEventListener('change', ()=>applyLayer(activeLayerId));
  dSel.addEventListener('change', ()=>applyLayer(activeLayerId));
  document.getElementById('searchInput').addEventListener('input', ()=>applyLayer(activeLayerId));
}

/* ============ KIOSK LIST ============ */
function buildKioskList(){
  const list = document.getElementById('kioskList');
  const layer = LAYERS.find(l=>l.id===activeLayerId);
  const regionSel = document.getElementById('filterRegion').value;
  const enseigneSel = document.getElementById('filterEnseigne').value;
  const drSel = document.getElementById('filterDr').value;
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

  const rows = markers.map(({kiosk, marker})=>{
    let extraMatch = true;
    if(regionSel && kiosk.region !== regionSel) extraMatch = false;
    if(enseigneSel && kiosk.enseigne !== enseigneSel) extraMatch = false;
    if(drSel && kiosk.dr !== drSel) extraMatch = false;
    if(searchTerm){
      const hay = (kiosk.kiosque+' '+kiosk.enseigne+' '+kiosk.dr+' '+kiosk.region+' '+kiosk.cp+' '+(kiosk.adresse||'')).toLowerCase();
      if(!hay.includes(searchTerm)) extraMatch = false;
    }
    let match = extraMatch;
    let color = '#2E7D5B';
    if(layer.mode==='filter'){ match = layer.test(kiosk) && extraMatch; color = layer.color; }
    else { color = colorFor(kiosk[layer.colorKey]||'Non renseigné', colorMaps[layer.colorKey]); }
    return { kiosk, marker, match, color };
  }).filter(r => r.match)
    .sort((a,b)=> a.kiosk.kiosque.localeCompare(b.kiosk.kiosque));

  document.getElementById('kioskListCount').textContent = rows.length;

  if(!rows.length){
    list.innerHTML = '<div class="empty-note">Aucun kiosque trouvé.</div>';
    return;
  }
  list.innerHTML = rows.map((r,i)=>
    '<div class="kiosk-row" data-idx="'+i+'"><span class="dot" style="background:'+r.color+';"></span><span class="name">'+r.kiosk.kiosque+'</span><span class="sub">'+r.kiosk.enseigne+'</span></div>'
  ).join('');

  list.querySelectorAll('.kiosk-row').forEach((el,i)=>{
    el.addEventListener('click', ()=>{
      const r = rows[i];
      map.setView(r.marker.getLatLng(), 13, { animate:true });
      clusterGroup.zoomToShowLayer(r.marker, ()=> r.marker.openPopup());
      if(window.innerWidth <= 860){ document.getElementById('sidebar').classList.remove('open'); }
    });
  });
}

/* ============ MOBILE TOGGLE ============ */
if(window.innerWidth <= 860){
  document.getElementById('mapToggle').style.display = 'flex';
}
document.getElementById('mapToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

/* ============ BOOT ============ */
buildMarkers();
</script>
